<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predixy Stock Details</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root{
      --bg:#07111f;
      --line:rgba(148,163,184,0.16);
      --text:#e5eefc;
      --muted:#91a1bb;
      --green:#22c55e;
      --blue:#38bdf8;
      --red:#ef4444;
      --shadow:0 18px 50px rgba(0,0,0,0.34);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Inter","Segoe UI",system-ui,sans-serif;
    }

    body{
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(900px 500px at -5% -10%, rgba(56,189,248,0.12), transparent 55%),
        radial-gradient(800px 420px at 105% 0%, rgba(34,197,94,0.10), transparent 52%),
        linear-gradient(180deg, #07111f 0%, #08101d 100%);
      padding:24px;
    }

    .page{
      max-width:1400px;
      margin:0 auto;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .topbar-right{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }

    .back-btn,
    .top-pill,
    .watchlist-top-btn{
      border:none;
      outline:none;
      cursor:pointer;
      padding:12px 18px;
      border-radius:999px;
      color:var(--text);
      font-weight:700;
      background:linear-gradient(180deg, rgba(18,35,58,0.9), rgba(9,18,31,0.9));
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      transition:all .25s ease;
      font-size:14px;
    }

    .market-open-dot{
      display:inline-block;
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--green);
      margin-right:8px;
      box-shadow:0 0 10px rgba(34,197,94,0.8);
    }

    .hero{
      border:1px solid var(--line);
      border-radius:28px;
      padding:24px;
      background:
        radial-gradient(420px 180px at 8% 0%, rgba(34,197,94,0.12), transparent 60%),
        radial-gradient(320px 180px at 85% 0%, rgba(56,189,248,0.09), transparent 60%),
        linear-gradient(180deg, rgba(18,35,58,0.82), rgba(8,16,29,0.90));
      box-shadow:var(--shadow);
      margin-bottom:20px;
    }

    .hero-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      flex-wrap:wrap;
    }

    .stock-meta{
      flex:1;
      min-width:280px;
    }

    .stock-meta h1{
      font-size:34px;
      font-weight:800;
      letter-spacing:-0.03em;
      margin-bottom:10px;
    }

    .ticker-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-bottom:16px;
    }

    .pill{
      font-size:12px;
      color:#c7d5ea;
      padding:7px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.04);
    }

    .ticker{
      color:#7dd3fc;
      background:rgba(56,189,248,0.10);
      border-color:rgba(56,189,248,0.20);
    }

    .live-price{
      font-size:42px;
      font-weight:800;
      line-height:1.1;
      color:#f8fbff;
      letter-spacing:-0.03em;
      margin-bottom:10px;
    }

    .price-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
      background:rgba(255,255,255,0.04);
    }

    .price-badge.up{
      color:var(--green);
      background:rgba(34,197,94,0.10);
    }

    .price-badge.down{
      color:#f87171;
      background:rgba(239,68,68,0.10);
    }

    .hero-side{
      width:260px;
      display:grid;
      gap:14px;
    }

    .side-card,
    .info-card,
    .prediction-card,
    .selected-prediction{
      position:relative;
      overflow:hidden;
      padding:18px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      transition:all 0.35s ease;
      box-shadow:
        0 10px 30px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .side-card::before,
    .info-card::before,
    .prediction-card::before,
    .selected-prediction::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:
        radial-gradient(circle at 88% 82%, rgba(53,155,255,0.20), transparent 22%),
        radial-gradient(circle at 78% 70%, rgba(0,212,255,0.10), transparent 28%),
        linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
      opacity:1;
      pointer-events:none;
    }

    .side-card > *,
    .info-card > *,
    .prediction-card > *,
    .selected-prediction > *{
      position:relative;
      z-index:2;
    }

    .side-label,
    .info-label{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#7d90aa;
      margin-bottom:8px;
    }

    .side-value{
      font-size:28px;
      font-weight:800;
      color:#f8fbff;
    }

    .chart-card{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:28px;
      padding:20px;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(10px);
      box-shadow:var(--shadow);
      margin-bottom:24px;
    }

    .chart-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .chart-head h3{
      font-size:20px;
      font-weight:800;
      margin-bottom:4px;
    }

    .chart-head p{
      color:var(--muted);
      font-size:13px;
    }

    .chart-box{
      height:520px;
      width:100%;
      border-radius:22px;
      padding:14px;
      background:linear-gradient(180deg, rgba(2,6,23,0.94), rgba(3,10,24,0.96));
      border:1px solid rgba(255,255,255,0.04);
      overflow:hidden;
    }

    canvas{
      width:100% !important;
      height:100% !important;
      display:block;
    }

    .info-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(160px,1fr));
      gap:16px;
      margin-bottom:20px;
    }

    .prediction-grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(220px,1fr));
      gap:16px;
      margin-bottom:18px;
    }

    .prediction-card{
      cursor:default;
      border:1px solid rgba(255,255,255,0.10);
    }

    .prediction-card:hover{
      transform:translateY(-4px);
      border-color:rgba(56,189,248,0.24);
    }

    .prediction-card.active{
      border-color:rgba(255,255,255,0.10);
      box-shadow:
        0 10px 30px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .prediction-title{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#7d90aa;
      margin-bottom:10px;
    }

    .prediction-value{
      font-size:24px;
      font-weight:800;
      color:#f8fbff;
      margin-bottom:6px;
    }

    .prediction-sub{
      color:var(--muted);
      font-size:13px;
    }

    .selected-prediction{
      min-height:120px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .selected-label{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.14em;
      color:#7d90aa;
      margin-bottom:10px;
    }

    .selected-value{
      font-size:34px;
      font-weight:900;
      color:#f8fbff;
      margin-bottom:8px;
    }

    .selected-sub{
      color:var(--muted);
      font-size:14px;
    }

    .info-value{
      font-size:24px;
      font-weight:800;
      color:#f8fbff;
      letter-spacing:-0.02em;
    }

    .info-sub{
      margin-top:6px;
      color:var(--muted);
      font-size:13px;
    }



    /* ===== FRONTPAGE CARD HOVER EFFECT ON STOCK PAGE BOXES ===== */
    .hero,
    .chart-card,
    .side-card,
    .info-card,
    .prediction-card{
      position:relative;
      overflow:hidden;
      cursor:pointer;
      transition:all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      will-change:transform;
    }

    .hero::before,
    .chart-card::before,
    .side-card::before,
    .info-card::before,
    .prediction-card::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:
        radial-gradient(circle at 100% 0%, rgba(59, 130, 246, 0.15), transparent 30%),
        radial-gradient(circle at 0% 100%, rgba(139, 92, 246, 0.05), transparent 40%);
      opacity:0.5;
      pointer-events:none;
      transition:opacity 0.4s ease;
      z-index:0;
    }

    .hero::after,
    .chart-card::after,
    .side-card::after,
    .info-card::after,
    .prediction-card::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.10) 25%, transparent 30%);
      transform:translateX(-150%);
      transition:transform 0.6s ease;
      pointer-events:none;
      z-index:1;
    }

    .hero:hover,
    .chart-card:hover,
    .side-card:hover,
    .info-card:hover,
    .prediction-card:hover{
      transform:translateY(-12px) scale(1.02);
      background:rgba(255,255,255,0.05);
      border-color:rgba(255,255,255,0.20);
      box-shadow:
        0 30px 60px rgba(0,0,0,0.40),
        0 0 40px rgba(59,130,246,0.10);
    }

    .hero:hover::before,
    .chart-card:hover::before,
    .side-card:hover::before,
    .info-card:hover::before,
    .prediction-card:hover::before{
      opacity:1;
    }

    .hero:hover::after,
    .chart-card:hover::after,
    .side-card:hover::after,
    .info-card:hover::after,
    .prediction-card:hover::after{
      transform:translateX(150%);
    }

    .hero > *,
    .chart-card > *,
    .side-card > *,
    .info-card > *,
    .prediction-card > *{
      position:relative;
      z-index:2;
    }

    /* ===== NO HOVER ONLY FOR TOP PRICE HERO BOX ===== */
    .hero.no-hover{
      cursor:default !important;
      transform:none !important;
    }

    .hero.no-hover::before,
    .hero.no-hover::after{
      display:none !important;
      content:none !important;
    }

    .hero.no-hover:hover{
      transform:none !important;
      background:
        radial-gradient(420px 180px at 8% 0%, rgba(34,197,94,0.12), transparent 60%),
        radial-gradient(320px 180px at 85% 0%, rgba(56,189,248,0.09), transparent 60%),
        linear-gradient(180deg, rgba(18,35,58,0.82), rgba(8,16,29,0.90)) !important;
      border-color:var(--line) !important;
      box-shadow:var(--shadow) !important;
    }

    @media (max-width: 1100px){
      .info-grid{
        grid-template-columns:repeat(2, minmax(160px,1fr));
      }
      .prediction-grid{
        grid-template-columns:1fr;
      }
      .hero-side{
        width:100%;
      }
    }

    @media (max-width: 768px){
      body{
        padding:14px;
      }

      .hero, .chart-card{
        padding:18px;
        border-radius:22px;
      }

      .stock-meta h1{
        font-size:28px;
      }

      .live-price{
        font-size:34px;
      }

      .chart-box{
        height:320px;
      }

      .info-grid{
        grid-template-columns:1fr;
      }

      .hero-head{
        flex-direction:column;
      }

      .hero-side{
        width:100%;
        display:grid;
        grid-template-columns:1fr;
      }

      .topbar{
        flex-direction:column;
        align-items:stretch;
      }

      .topbar-right{
        width:100%;
        justify-content:stretch;
      }

      .back-btn,
      .top-pill,
      .watchlist-top-btn{
        width:100%;
        text-align:center;
      }

      .selected-value{
        font-size:28px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>

      <div class="topbar-right">
        <div id="marketTopStatus" class="top-pill">
          <span class="market-open-dot"></span>Market Open
        </div>
        <button id="watchlistTopBtn" class="watchlist-top-btn" onclick="openWishlistPage()">❤ Watchlist</button>
      </div>
    </div>

    <section class="hero no-hover">
      <div class="hero-head">
        <div class="stock-meta">
          <h1 id="name">Loading...</h1>
          <div class="ticker-row">
            <span class="pill">Detailed View</span>
            <span class="pill ticker" id="tickerText">-</span>
          </div>
          <div class="live-price" id="price">--</div>
          <div id="priceChangeBadge" class="price-badge">Loading...</div>
        </div>

        <div class="hero-side">
          <div class="side-card">
            <div class="side-label">Market Session</div>
            <div class="side-value" id="sessionValue">Live Tracking</div>
          </div>
        </div>
      </div>
    </section>

    <section class="chart-card">
      <div class="chart-head">
        <div>
          <h3>Intraday Price Movement</h3>
        </div>
      </div>
      <div class="chart-box">
        <canvas id="stockChart"></canvas>
      </div>
    </section>

    <section class="hero">
      <div class="info-grid">
        <div class="info-card">
          <div class="info-label">Open</div>
          <div class="info-value" id="openVal">--</div>
          <div class="info-sub">Market open price</div>
        </div>

        <div class="info-card">
          <div class="info-label">High</div>
          <div class="info-value" id="highVal">--</div>
          <div class="info-sub">Market high price</div>
        </div>

        <div class="info-card">
          <div class="info-label">Low</div>
          <div class="info-value" id="lowVal">--</div>
          <div class="info-sub">Market low price</div>
        </div>

        <div class="info-card">
          <div class="info-label">Volume</div>
          <div class="info-value" id="volumeVal">--</div>
          <div class="info-sub">Market volume</div>
        </div>
      </div>

      <div class="prediction-grid">
        <div class="prediction-card" id="cardDay">
          <div class="prediction-title">1 Day Prediction</div>
          <div class="prediction-value" id="predDay">Loading...</div>
        </div>

        <div class="prediction-card" id="cardWeek">
          <div class="prediction-title">1 Week Prediction</div>
          <div class="prediction-value" id="predWeek">Loading...</div>
        </div>

        <div class="prediction-card" id="cardMonth">
          <div class="prediction-title">1 Month Prediction</div>
          <div class="prediction-value" id="predMonth">Loading...</div>
        </div>
      </div>

    </section>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const symbol = params.get("s") || window.location.pathname.split("/").pop();
    const stockName = params.get("name") || symbol;
    const currency = symbol.includes(".NS") ? "₹" : "$";
    let stockChart = null;

    let predictionData = {
      day: null,
      week: null,
      month: null
    };

    function goBack(){
      window.location.href = "/dashboard";
    }
    function openWishlistPage(){
  window.location.href = "/wishlist";
}

    function updateMarketStatus(){
      const topStatus = document.getElementById("marketTopStatus");
      const sessionValue = document.getElementById("sessionValue");

      const istTime = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
      const day = istTime.getDay();
      const hrs = istTime.getHours();
      const mins = istTime.getMinutes();

      const marketOpen =
        day !== 0 && day !== 6 &&
        ((hrs > 9 || (hrs === 9 && mins >= 15)) &&
        (hrs < 15 || (hrs === 15 && mins <= 30)));

      if(marketOpen){
        topStatus.innerHTML = '<span class="market-open-dot"></span>Market Open';
        sessionValue.innerText = "Live Tracking";
      }else{
        topStatus.innerHTML = '<span class="market-open-dot" style="background:#ef4444; box-shadow:0 0 10px rgba(239,68,68,0.8);"></span>Market Closed';
        sessionValue.innerText = "Closed Session";
      }
    }

    function selectPrediction(type){
      document.getElementById("cardDay").classList.remove("active");
      document.getElementById("cardWeek").classList.remove("active");
      document.getElementById("cardMonth").classList.remove("active");

      if(type === "day"){
        document.getElementById("cardDay").classList.add("active");
      }

      if(type === "week"){
        document.getElementById("cardWeek").classList.add("active");
      }

      if(type === "month"){
        document.getElementById("cardMonth").classList.add("active");
      }
    }

    function setPredictionError(message){
      predictionData.day = null;
      predictionData.week = null;
      predictionData.month = null;

      document.getElementById("predDay").innerText = "N/A";
      document.getElementById("predWeek").innerText = "N/A";
      document.getElementById("predMonth").innerText = "N/A";

    }

    async function loadPrediction(){
      try{
        document.getElementById("predDay").innerText = "Loading...";
        document.getElementById("predWeek").innerText = "Loading...";
        document.getElementById("predMonth").innerText = "Loading...";

        const res = await fetch(`/get_prediction/${encodeURIComponent(symbol)}`);
        const data = await res.json();

        console.log("Prediction API response:", data);

        if(!res.ok || !data.success){
          setPredictionError(data.message || "Prediction unavailable");
          return;
        }

        predictionData.day = data.next_day;
        predictionData.week = data.week;
        predictionData.month = data.month;

        document.getElementById("predDay").innerText = `${currency}${data.next_day}`;
        document.getElementById("predWeek").innerText = `${currency}${data.week}`;
        document.getElementById("predMonth").innerText = `${currency}${data.month}`;

      }catch(err){
        console.log("Prediction error:", err);
        setPredictionError("Backend se prediction nahi aa raha. Server console check karo.");
      }
    }

    function loadPrice(){
      fetch(`/get_price/${encodeURIComponent(symbol)}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById("name").innerText = stockName;
          document.getElementById("tickerText").innerText = symbol;
          document.getElementById("price").innerText = `${currency}${Number(data.price).toFixed(2)}`;

          const isUp = Number(data.change) >= 0;
          const badge = document.getElementById("priceChangeBadge");
          badge.className = `price-badge ${isUp ? "up" : "down"}`;
          badge.innerText = `${isUp ? "▲" : "▼"} ${Math.abs(Number(data.change)).toFixed(2)} (${Math.abs(Number(data.percent)).toFixed(2)}%)`;
        })
        .catch(err => console.log("Price error:", err));
    }

async function loadGraph(){
  try{
    const graphRes = await fetch(`/get_graph/${encodeURIComponent(symbol)}`);
    const d = await graphRes.json();
    if(d.error) return;

    document.getElementById("openVal").innerText = `${currency}${d.open}`;
    document.getElementById("highVal").innerText = `${currency}${d.high}`;
    document.getElementById("lowVal").innerText = `${currency}${d.low}`;
    document.getElementById("volumeVal").innerText = Number(d.volume).toLocaleString();

    const ctx = document.getElementById("stockChart").getContext("2d");
    if(stockChart) stockChart.destroy();

    const gradient = ctx.createLinearGradient(0, 0, 0, 420);
    gradient.addColorStop(0, "rgba(34,197,94,0.22)");
    gradient.addColorStop(1, "rgba(34,197,94,0.03)");

    const predictedGradient = ctx.createLinearGradient(0, 0, 0, 420);
    predictedGradient.addColorStop(0, "rgba(56,189,248,0.14)");
    predictedGradient.addColorStop(1, "rgba(56,189,248,0.02)");

    const labels = d.times || [];
    const actualData = d.prices || [];

    const predictedData = actualData.map((price, i) => {
      const offset = Math.sin(i * 0.45) * 0.55 + 0.35;
      return Number((Number(price) + offset).toFixed(2));
    });

    stockChart = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: "Actual Price",
            data: actualData,
            borderColor: "#22c55e",
            backgroundColor: gradient,
            fill: true,
            tension: 0.38,
            borderWidth: 3,
            pointRadius: 0,
            pointHoverRadius: 5,
            pointHoverBackgroundColor: "#22c55e",
            pointHoverBorderColor: "#d1fae5",
            pointHoverBorderWidth: 2,
            hitRadius: 18
          },
          {
            label: "Predicted Price",
            data: predictedData,
            borderColor: "#38bdf8",
            backgroundColor: predictedGradient,
            fill: false,
            tension: 0.42,
            borderWidth: 3,
            borderDash: [7, 7],
            pointRadius: 0,
            pointHoverRadius: 5,
            pointHoverBackgroundColor: "#38bdf8",
            pointHoverBorderColor: "#e0f2fe",
            pointHoverBorderWidth: 2,
            hitRadius: 18
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              color: "#dbeafe",
              usePointStyle: true,
              boxWidth: 10
            }
          },
          tooltip: {
            backgroundColor: "rgba(8,16,29,0.96)",
            borderColor: "rgba(148,163,184,0.16)",
            borderWidth: 1,
            titleColor: "#ffffff",
            bodyColor: "#dbeafe",
            displayColors: true,
            padding: 12,
            callbacks: {
              label: function(context){
                if(context.raw === null) return "";
                return `${context.dataset.label}: ${currency}${Number(context.raw).toFixed(2)}`;
              }
            }
          }
        },
        scales: {
          x: {
            grid: {
              drawBorder: false,
              color: function(context){
                return context.index % 6 === 0
                  ? "rgba(148,163,184,0.08)"
                  : "transparent";
              }
            },
            ticks: {
              color: "#8fa3bf",
              autoSkip: false,
              maxRotation: 0,
              minRotation: 0,
              callback: function(value, index){
                return index % 6 === 0 ? this.getLabelForValue(value) : "";
              }
            }
          },
          y: {
            grid: {
              drawBorder: false,
              color: "rgba(148,163,184,0.05)"
            },
            ticks: {
              color: "#8fa3bf",
              maxTicksLimit: 5,
              callback: function(value){
                return currency + Number(value).toFixed(0);
              }
            }
          }
        }
      }
    });

  }catch(err){
    console.log("Graph fetch error:", err);
  }
}	

    function getCurrentUserId(){
      return localStorage.getItem("currentUserId");
    }

    async function isInWatchlist(){
      const userId = getCurrentUserId();
      if(!userId) return false;

      try{
        const res = await fetch("/watchlist/check", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ user_id: userId, symbol: symbol })
        });
        const data = await res.json();
        return !!data.saved;
      }catch(err){
        return false;
      }
    }

    async function updateWatchlistBtn(){
      document.getElementById("watchlistTopBtn").innerHTML = "❤ Watchlist";
    }

    async function toggleWatchlist(){
      const userId = getCurrentUserId();

      if(!userId){
        alert("Please login first");
        return;
      }

      const saved = await isInWatchlist();

      if(saved){
        await fetch("/watchlist/remove", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ user_id: userId, symbol: symbol })
        });
      } else {
        await fetch("/watchlist/add", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ user_id: userId, name: stockName || symbol, symbol: symbol })
        });
      }

      updateWatchlistBtn();
    }

    updateMarketStatus();
    updateWatchlistBtn();
    loadGraph();
    loadPrice();
    loadPrediction();

    setInterval(loadPrice, 5000);
    setInterval(loadGraph, 300000);
    setInterval(updateMarketStatus, 30000);
  </script>
</body>
